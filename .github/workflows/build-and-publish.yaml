name: Build and publish the Docker image to Docker Hub

on:
  workflow_call:
    inputs:
      push_latest:
        type: boolean
        description: Also tag the image as latest and push a git tag for the version
        default: false
    secrets:
      docker_hub_username:
        required: true
      docker_hub_password:
        required: true
    outputs:
      version:
        description: The semantic version of the built Docker image
        value: ${{ jobs.build.outputs.version }}

concurrency:
  # One build at a time, so version calculation and tagging don't race.
  group: arbor-leaderboard-build
  cancel-in-progress: false

env:
  IMAGE: eddgrant/arbor-leaderboard
  # Docker tags can't contain '+', so PR builds use '-' rather than semver build metadata.
  version_format: ${{ github.event_name == 'pull_request' && format('${{major}}.${{minor}}.${{patch}}-pr.{0}-{1}', github.event.number, github.sha) || '${major}.${minor}.${patch}' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: service

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.semver.outputs.version }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # History and tags for semantic version calculation

      - name: Determine semantic version
        id: semver
        uses: paulhatch/semantic-version@v6.0.4
        with:
          bump_each_commit: true
          version_format: ${{ env.version_format }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.docker_hub_username }}
          password: ${{ secrets.docker_hub_password }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: service
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.semver.outputs.version }}
            ${{ inputs.push_latest && format('{0}:latest', env.IMAGE) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.semver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Push version tag
        if: inputs.push_latest
        run: |
          git tag ${{ steps.semver.outputs.version }}
          git push origin ${{ steps.semver.outputs.version }}
